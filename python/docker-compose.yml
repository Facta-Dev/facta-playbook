# Local dev: postgres + migrations + the API (+ the janitor worker).
# `docker compose up -d` after scripts/rename.sh is the whole boot path —
# the migrations service applies the schema, the API starts after it.
# <APP>_OFFLINE=true (from .env.example) keeps the mailer on the console
# sender by default.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: <app>
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 15
    volumes:
      - pgdata:/var/lib/postgresql/data

  # One-shot schema runner: the API never migrates itself (replicas race), so
  # the boot path goes through this service — Alembic from the image, against
  # the compose Postgres.
  migrations:
    build: .
    entrypoint: ["alembic", "upgrade", "head"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <APP>_DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/<app>

  api:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
    env_file: .env.example
    environment:
      <APP>_DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/<app>
      # dev-only secret; override it in any shared environment.
      <APP>_JWT_SECRET: dev-compose-secret-32-bytes-min!
      <APP>_OFFLINE: "true"
    ports:
      - "8000:8000"

  # Janitor/outbox worker (expired sessions, stale codes, email_jobs): same
  # image, different entrypoint. Drop this service if you run the worker
  # another way.
  worker:
    build: .
    entrypoint: ["python", "-m", "app.bin.worker"]
    restart: unless-stopped
    depends_on:
      migrations:
        condition: service_completed_successfully
    env_file: .env.example
    environment:
      <APP>_DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/<app>
      <APP>_JWT_SECRET: dev-compose-secret-32-bytes-min!
      <APP>_OFFLINE: "true"

volumes:
  pgdata: {}
