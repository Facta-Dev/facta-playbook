name: docker-publish
on:
  push:
    branches: [main]
    paths:
      [
        ".github/workflows/docker-publish.yml",
        "Dockerfile",
        "pyproject.toml",
        "src/**",
        "migrations/**",
      ]
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/<app>/api:latest
            ghcr.io/${{ github.repository_owner }}/<app>/api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
