      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/SessionResponse'
                title: Response Sessions Api V1 Auth Sessions Get
                type: array
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
