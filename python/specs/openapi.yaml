components:
  schemas:
    AccountResponse:
      properties:
        email:
          title: Email
          type: string
        first_name:
          title: First Name
          type: string
        id:
          title: Id
          type: string
        language:
          title: Language
          type: string
        last_login:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Last Login
        last_name:
          title: Last Name
          type: string
        role:
          title: Role
          type: string
      required:
      - id
      - email
      - role
      - first_name
      - last_name
      - language
      - last_login
      title: AccountResponse
      type: object
    AdminUserListResponse:
      properties:
        items:
          items:
            $ref: '#/components/schemas/AdminUserResponse'
          title: Items
          type: array
        total:
          title: Total
          type: integer
      required:
      - items
      - total
      title: AdminUserListResponse
      type: object
    AdminUserResponse:
      properties:
        created_at:
          format: date-time
          title: Created At
          type: string
        email:
          title: Email
          type: string
        first_name:
          title: First Name
          type: string
        id:
          title: Id
          type: string
        is_active:
          title: Is Active
          type: boolean
        is_blocked:
          title: Is Blocked
          type: boolean
        is_verified:
          title: Is Verified
          type: boolean
        language:
          title: Language
          type: string
        last_login:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Last Login
        last_name:
          title: Last Name
          type: string
        role:
          title: Role
          type: string
      required:
      - id
      - email
      - first_name
      - last_name
      - role
      - is_active
      - is_blocked
      - is_verified
      - language
      - created_at
      - last_login
      title: AdminUserResponse
      type: object
    AnomalyResponse:
      properties:
        distinct_ips:
          title: Distinct Ips
          type: integer
        email:
          title: Email
          type: string
        sessions:
          title: Sessions
          type: integer
        user_id:
          title: User Id
          type: string
      required:
      - user_id
      - email
      - distinct_ips
      - sessions
      title: AnomalyResponse
      type: object
    ChangeRequest:
      properties:
        current_password:
          maxLength: 128
          minLength: 1
          title: Current Password
          type: string
        new_password:
          maxLength: 128
          minLength: 8
          title: New Password
          type: string
      required:
      - current_password
      - new_password
      title: ChangeRequest
      type: object
    ChangeResponse:
      properties:
        changed:
          title: Changed
          type: boolean
      required:
      - changed
      title: ChangeResponse
      type: object
    ConnectResponse:
      properties:
        url:
          title: Url
          type: string
      required:
      - url
      title: ConnectResponse
      type: object
    ForgotRequest:
      properties:
        email:
          maxLength: 254
          minLength: 3
          pattern: ^[^@\s]+@[^@\s]+\.[^@\s]+$
          title: Email
          type: string
      required:
      - email
      title: ForgotRequest
      type: object
    ForgotResponse:
      properties:
        queued:
          title: Queued
          type: boolean
      required:
      - queued
      title: ForgotResponse
      type: object
    GoogleRequest:
      properties:
        credential:
          maxLength: 8192
          minLength: 1
          title: Credential
          type: string
      required:
      - credential
      title: GoogleRequest
      type: object
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          title: Detail
          type: array
      title: HTTPValidationError
      type: object
    LoginRequest:
      properties:
        email:
          maxLength: 254
          minLength: 3
          pattern: ^[^@\s]+@[^@\s]+\.[^@\s]+$
          title: Email
          type: string
        password:
          maxLength: 128
          minLength: 8
          title: Password
          type: string
      required:
      - email
      - password
      title: LoginRequest
      type: object
    LogoutRequest:
      properties:
        refresh_token:
          maxLength: 256
          minLength: 32
          title: Refresh Token
          type: string
      required:
      - refresh_token
      title: LogoutRequest
      type: object
    RefreshRequest:
      properties:
        refresh_token:
          maxLength: 256
          minLength: 32
          title: Refresh Token
          type: string
      required:
      - refresh_token
      title: RefreshRequest
      type: object
    ResendRequest:
      properties:
        email:
          maxLength: 254
          minLength: 3
          pattern: ^[^@\s]+@[^@\s]+\.[^@\s]+$
          title: Email
          type: string
      required:
      - email
      title: ResendRequest
      type: object
    ResendResponse:
      properties:
        queued:
          title: Queued
          type: boolean
      required:
      - queued
      title: ResendResponse
      type: object
    ResetRequest:
      properties:
        code:
          maxLength: 6
          minLength: 6
          title: Code
          type: string
        email:
          maxLength: 254
          minLength: 3
          pattern: ^[^@\s]+@[^@\s]+\.[^@\s]+$
          title: Email
          type: string
        new_password:
          maxLength: 128
          minLength: 8
          title: New Password
          type: string
      required:
      - email
      - code
      - new_password
      title: ResetRequest
      type: object
    ResetResponse:
      properties:
        reset:
          title: Reset
          type: boolean
      required:
      - reset
      title: ResetResponse
      type: object
    RevokeResponse:
      properties:
        revoked:
          title: Revoked
          type: integer
      required:
      - revoked
      title: RevokeResponse
      type: object
    Role:
      description: Account roles, lowest privilege first.
      enum:
      - guest
      - user
      - moderator
      - admin
      title: Role
      type: string
    SessionResponse:
      properties:
        created_at:
          format: date-time
          title: Created At
          type: string
        current:
          title: Current
          type: boolean
        expires_at:
          format: date-time
          title: Expires At
          type: string
        id:
          title: Id
          type: string
        ip:
          title: Ip
          type: string
        user_agent:
          title: User Agent
          type: string
      required:
      - id
      - ip
      - user_agent
      - created_at
      - expires_at
      - current
      title: SessionResponse
      type: object
    SignupRequest:
      properties:
        email:
          maxLength: 254
          minLength: 3
          pattern: ^[^@\s]+@[^@\s]+\.[^@\s]+$
          title: Email
          type: string
        first_name:
          default: ''
          maxLength: 100
          title: First Name
          type: string
        language:
          default: en
          maxLength: 10
          title: Language
          type: string
        last_name:
          default: ''
          maxLength: 100
          title: Last Name
          type: string
        password:
          maxLength: 128
          minLength: 8
          title: Password
          type: string
      required:
      - email
      - password
      title: SignupRequest
      type: object
    SignupResponse:
      properties:
        code_queued:
          title: Code Queued
          type: boolean
        user_id:
          title: User Id
          type: string
      required:
      - user_id
      - code_queued
      title: SignupResponse
      type: object
    TokenResponse:
      properties:
        access_token:
          title: Access Token
          type: string
        refresh_token:
          title: Refresh Token
          type: string
      required:
      - access_token
      - refresh_token
      title: TokenResponse
      type: object
    UpdateMeRequest:
      properties:
        first_name:
          anyOf:
          - maxLength: 100
            type: string
          - type: 'null'
          title: First Name
        language:
          anyOf:
          - maxLength: 10
            type: string
          - type: 'null'
          title: Language
        last_name:
          anyOf:
          - maxLength: 100
            type: string
          - type: 'null'
          title: Last Name
      title: UpdateMeRequest
      type: object
    UpdateRequest:
      properties:
        is_active:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Is Active
        is_blocked:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Is Blocked
        role:
          anyOf:
          - $ref: '#/components/schemas/Role'
          - type: 'null'
      title: UpdateRequest
      type: object
    UpgradeRequest:
      properties:
        email:
          maxLength: 254
          minLength: 3
          pattern: ^[^@\s]+@[^@\s]+\.[^@\s]+$
          title: Email
          type: string
      required:
      - email
      title: UpgradeRequest
      type: object
    UpgradeResponse:
      properties:
        email:
          title: Email
          type: string
        message:
          title: Message
          type: string
        upgraded:
          title: Upgraded
          type: boolean
      required:
      - email
      - message
      - upgraded
      title: UpgradeResponse
      type: object
    ValidateRequest:
      properties:
        code:
          maxLength: 6
          minLength: 6
          title: Code
          type: string
        email:
          maxLength: 254
          minLength: 3
          pattern: ^[^@\s]+@[^@\s]+\.[^@\s]+$
          title: Email
          type: string
      required:
      - email
      - code
      title: ValidateRequest
      type: object
    ValidateResponse:
      properties:
        valid:
          title: Valid
          type: boolean
      required:
      - valid
      title: ValidateResponse
      type: object
    ValidationError:
      properties:
        ctx:
          title: Context
          type: object
        input:
          title: Input
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          title: Location
          type: array
        msg:
          title: Message
          type: string
        type:
          title: Error Type
          type: string
      required:
      - loc
      - msg
      - type
      title: ValidationError
      type: object
    VerifyRequest:
      properties:
        code:
          maxLength: 6
          minLength: 6
          title: Code
          type: string
        email:
          maxLength: 254
          minLength: 3
          pattern: ^[^@\s]+@[^@\s]+\.[^@\s]+$
          title: Email
          type: string
      required:
      - email
      - code
      title: VerifyRequest
      type: object
    VerifyResponse:
      properties:
        verified:
          title: Verified
          type: boolean
      required:
      - verified
      title: VerifyResponse
      type: object
    WidgetListResponse:
      properties:
        items:
          items:
            $ref: '#/components/schemas/WidgetResponse'
          title: Items
          type: array
      required:
      - items
      title: WidgetListResponse
      type: object
    WidgetRequest:
      properties:
        kind:
          maxLength: 32
          minLength: 1
          title: Kind
          type: string
        name:
          maxLength: 120
          minLength: 1
          title: Name
          type: string
      required:
      - name
      - kind
      title: WidgetRequest
      type: object
    WidgetResponse:
      properties:
        created_at:
          format: date-time
          title: Created At
          type: string
        id:
          title: Id
          type: string
        kind:
          title: Kind
          type: string
        name:
          title: Name
          type: string
        owner_user_id:
          title: Owner User Id
          type: string
      required:
      - id
      - name
      - kind
      - owner_user_id
      - created_at
      title: WidgetResponse
      type: object
  securitySchemes:
    HTTPBearer:
      scheme: bearer
      type: http
info:
  title: <app>
  version: 0.1.0
openapi: 3.1.0
paths:
  /api/v1/admin/auth-session/anomalies:
    get:
      operationId: anomalies_api_v1_admin_auth_session_anomalies_get
