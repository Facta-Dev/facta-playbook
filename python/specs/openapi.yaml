        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/AnomalyResponse'
                title: Response Anomalies Api V1 Admin Auth Session Anomalies Get
                type: array
          description: Successful Response
      security:
      - HTTPBearer: []
      summary: Anomalies
      tags:
      - auth
  /api/v1/admin/auth-session/users/{user_id}/revoke-all:
