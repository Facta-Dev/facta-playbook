[project]
name = "app-template"
version = "0.1.0"
description = "Backend Python template: FastAPI + hexagonal architecture + vertical slices + DB outbox."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "<scope>" }]

dependencies = [
  "alembic>=1.14",
  "argon2-cffi>=23.1",
  "asyncpg>=0.30",
  "fastapi>=0.115",
  "httpx>=0.28",
  "pyjwt>=2.10",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "sqlalchemy[asyncio]>=2.0.36",
  "uvicorn[standard]>=0.32",
]

[dependency-groups]
dev = [
  "import-linter>=2.1",
  "mypy>=1.13",
  "pip-audit>=2.7",
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-bdd>=7.3",
  "pyyaml>=6.0",
  "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests", "evals", "scripts"]

[tool.ruff.lint]
select = [
  "E",     # pycodestyle errors
  "F",     # pyflakes
  "W",     # pycodestyle warnings
  "I",     # import sorting
  "B",     # bugbear
  "UP",    # pyupgrade
  "EM",    # exception messages built, never inlined
  "ASYNC", # blocking calls and un-awaited coroutines
  "S",     # bandit: asserts, hardcoded secrets, weak crypto
  "RUF",   # ruff-specific, including unused noqa
  "DTZ",   # timezone-aware datetimes only
]
ignore = [
  "S101", # asserts are allowed in tests via per-file-ignores below
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S107", "S311"]
"evals/**" = ["S101"]
"src/app/features/*/domain.py" = ["S105"]
"src/app/shared/apperr.py" = ["S105"]
"src/app/bin/*" = ["S104"]
"scripts/export_openapi.py" = ["S106"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_reexport = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
packages = ["app"]
explicit_package_bases = true

[[tool.mypy.overrides]]
module = ["asyncpg.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q"
testpaths = ["tests"]

[tool.importlinter]
root_packages = ["app"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Layered architecture (dependencies point inward)"
type = "layers"
layers = [
  "app.bin",
  "app.features",
  "app.platform",
  "app.shared",
]

[[tool.importlinter.contracts]]
name = "Domain and kernel are I/O-free"
type = "forbidden"
source_modules = [
  "app.shared",
  "app.features.authsignup.domain",
  "app.features.authsession.domain",
  "app.features.authpassword.domain",
  "app.features.authoauth.domain",
  "app.features.adminusers.domain",
  "app.features.widgets.domain",
]
forbidden_modules = [
  "fastapi",
  "sqlalchemy",
  "asyncpg",
  "alembic",
  "httpx",
  "uvicorn",
]

[[tool.importlinter.contracts]]
name = "Feature slices are independent"
type = "independence"
modules = [
  "app.features.authsignup",
  "app.features.authsession",
  "app.features.authpassword",
  "app.features.authoauth",
  "app.features.adminusers",
  "app.features.widgets",
  "app.features.realtime",
]
