# Production composition: edge nginx + the published image (built locally
# when the image is absent). Migrations run as a release step — the
# `migrations` service runs Alembic, never the API boot — and secrets come
# from the host .env, never baked into the image.
services:
  nginx:
    build: ./infra/nginx
    ports:
      - "80:80"
    depends_on:
      - api

  api:
    image: ${<APP>_API_IMAGE:-ghcr.io/<scope>/<app>/api:latest}
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 15s
      timeout: 3s
      start_period: 10s
      retries: 3

  # Release-step runner (CI):
  #   docker compose -f docker-compose.prod.yml --profile tools run --rm migrations
  migrations:
    image: ${<APP>_API_IMAGE:-ghcr.io/<scope>/<app>/api:latest}
    build:
      context: .
      dockerfile: Dockerfile
    profiles: [tools]
    entrypoint: ["alembic", "upgrade", "head"]
    depends_on: []
    # The DSN rides in .env as <APP>_DATABASE_URL (env_file) — or pass it:
    #   <APP>_DATABASE_URL=... docker compose ... run --rm migrations
    env_file: .env

  worker:
    image: ${<APP>_API_IMAGE:-ghcr.io/<scope>/<app>/api:latest}
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    entrypoint: ["python", "-m", "app.bin.worker"]
    env_file: .env
