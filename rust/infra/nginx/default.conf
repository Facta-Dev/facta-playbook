# `<app>` — nginx inside the compose network (in front of the api container).
# TLS terminates upstream (ALB / Cloudflare); this listens on :80 and trusts
# X-Forwarded-Proto. Upstreams are compose service names, not 127.0.0.1.
#
#   /api/   → api (Axum :8080) — REST + OpenAPI
#   /       → api /healthz (edge liveness)
#
# ponytail: rename every `<app>` -> your project name before building.

map $http_x_forwarded_proto $<app>_forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}
map $http_upgrade $<app>_connection_upgrade {
    default upgrade;
    ""      close;
}

upstream <app>_api { server api:8080; keepalive 32; }

server {
    listen 80;
    server_name <app>.example.com;

    # Edge liveness — proxied to the api /healthz (never touches the DB).
    location = /healthz {
        proxy_pass http://<app>_api/healthz;
        proxy_set_header Host $host;
    }

    # Readiness — proxied to the api /readyz (probes the DB).
    location = /readyz {
        proxy_pass http://<app>_api/readyz;
        proxy_set_header Host $host;
    }

    # REST API + OpenAPI docs. Strip the /api prefix so the api sees /widgets,
    # /docs, etc. at its root.
    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://<app>_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $<app>_forwarded_proto;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $<app>_connection_upgrade;
    }

    # Redirect bare /api to /api/ so the prefix-strip rewrite applies.
    location = /api { return 308 /api/; }
}
