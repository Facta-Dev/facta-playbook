services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: <app>
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["5432:5432"]
  app:
    build: .
    depends_on: [db]
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/<app>
    ports: ["8080:8080"]
